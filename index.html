<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 기반 수업 혁신 · PBL 설계 멘토</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f4ef;--ink:#1f2a37;--muted:#6b7280;--line:#e3dfd5;--accent:#2f7a63;--accent-soft:#e2f2eb;--warm:#f2a541;--warm-soft:#fdf1dc;--bot:#f1efe9;--mint:#d3f1e4;--peach:#fde3d3;--beige:#f6e7b8;--th:#dfe6f2;--danger:#b4443a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.jua{font-family:"Jua",sans-serif;font-weight:400}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 34px;box-shadow:0 6px 24px rgba(0,0,0,.06);width:min(520px,100%)}
.login h1{font-family:"Jua";font-weight:400;font-size:32px;margin:0 0 4px;color:var(--accent)}
.login p{color:var(--muted);margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.field input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:15px;font-weight:500}
.note{font-size:14px;color:var(--muted);margin-top:12px}
.err{color:var(--danger);font-size:15px;min-height:1.4em}

/* app */
.app{display:flex;flex-direction:column;height:100%}
header{padding:10px 20px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:"Jua";font-weight:400;font-size:24px;margin:0}
header .who{opacity:.9;font-size:15px}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;font-size:15px}
.hbtn:hover{background:rgba(255,255,255,.28)}
.status{font-size:14px;opacity:.9}
.body{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 380px;min-height:0}
nav.steps{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
.stepbtn{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:8px 10px;margin-bottom:2px;color:var(--ink);font-size:15.5px}
.stepbtn:hover{background:#f4f2ec}
.stepbtn.on{background:var(--warm-soft);font-weight:700}
.stepbtn .n{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#dcd8cf;color:#fff;font-size:13px;font-weight:700;margin-top:1px}
.stepbtn.done .n{background:var(--accent)}
.stepbtn.part .n{background:var(--warm)}
.navnote{font-size:13px;color:var(--muted);padding:10px;border-top:1px dashed var(--line);margin-top:10px}

main{overflow-y:auto;padding:22px 28px 60px}
.stephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stephead h2{font-family:"Jua";font-weight:400;font-size:28px;margin:0}
.stephead .lv{color:var(--muted);font-size:15px}
.guide{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.guide .todo{padding:14px 18px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.guide .todo b{color:var(--accent)}
.guide details{border-bottom:1px solid var(--line)}
.guide details:last-child{border-bottom:none}
.guide summary{padding:10px 18px;cursor:pointer;font-weight:700;list-style:none}
.guide summary::before{content:"▸ ";color:var(--accent)}
.guide details[open] summary::before{content:"▾ "}
.guide .in{padding:2px 18px 14px}
.guide ul{margin:4px 0;padding-left:22px}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.checks input{margin-top:6px;width:17px;height:17px;accent-color:var(--accent)}
.example{background:#faf8f2;border-left:4px solid var(--beige);padding:10px 14px;border-radius:6px;white-space:pre-wrap;font-size:15.5px}
.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.form h3{margin:0 0 12px;font-size:18px}
.f{margin-bottom:16px}
.f>label{display:block;font-weight:700;margin-bottom:4px}
.f .hint{font-size:14px;color:var(--muted);margin:-2px 0 6px}
.f input[type=text],.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffefb}
.f textarea{resize:vertical;min-height:70px;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.comp{display:flex;gap:14px;flex-wrap:wrap}
.comp label{display:flex;gap:6px;align-items:center;cursor:pointer}
.comp input{width:17px;height:17px;accent-color:var(--accent)}
.rows{width:100%;border-collapse:collapse;margin-bottom:6px}
.rows th{background:var(--th);font-size:15px;padding:6px;border:1px solid #cfd6e3}
.rows td{border:1px solid var(--line);padding:4px;vertical-align:top}
.rows textarea,.rows input{width:100%;border:none;background:transparent;padding:6px;resize:vertical;min-height:44px;overflow:hidden}
.rows textarea:focus,.rows input:focus{outline:2px solid var(--warm);background:#fffbea}
.del{border:none;background:none;color:var(--danger);font-size:15px}
.add{border:1px dashed #9aa;background:#fff;color:#567;border-radius:8px;padding:5px 12px;font-size:14px}
.stagebox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fffefb}
.stagebox .t{font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.stagebox .t input{width:110px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:400}
.navrow{display:flex;justify-content:space-between;margin-top:18px}

aside.mentor{border-left:1px solid var(--line);background:#fbfaf7;display:flex;flex-direction:column;min-height:0}
.mhead{padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.mhead b{font-family:"Jua";font-weight:400;font-size:20px;color:var(--accent)}
.mhead .rem{font-size:13px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px}
.msg{margin-bottom:12px;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15.5px}
.msg.bot{background:var(--bot);border-top-left-radius:4px}
.msg.user{background:var(--accent);color:#fff;margin-left:28px;border-top-right-radius:4px}
.msg.sys{background:#fde8e6;color:#8b2a20}
.msg .tag{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.mactions{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;border-top:1px solid var(--line);background:#fff}
.mactions button{flex:1;min-width:100px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:10px;padding:7px 8px;font-size:15px}
.mactions button.primary{background:var(--accent);color:#fff}
.mactions button:disabled{opacity:.45;cursor:default}
.ask{display:flex;gap:8px;padding:8px 12px 12px;background:#fff}
.ask textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:none;height:46px;font-size:15.5px}
.ask button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:700}

/* modal + preview doc */
.modal{position:fixed;inset:0;background:rgba(20,25,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:20}
.modal .box{background:#fff;border-radius:14px;width:min(900px,100%);padding:18px 20px 26px}
.modal .bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.modal .bar h3{margin:0;flex:1}
.doc{font-size:14.5px;padding:10px 6px}
.titlebox{display:flex;margin-bottom:6px}
.titlebox .k{background:var(--peach);font-size:24px;font-weight:700;display:grid;place-items:center;width:58px;writing-mode:vertical-rl;letter-spacing:10px}
.titlebox .v{flex:1;background:var(--mint);text-align:center;padding:12px 10px}
.titlebox .fixed{font-size:21px;font-weight:700}
.titlebox .topic{font-size:19px;font-weight:700;color:#1b7a2a;display:block}
.byline{text-align:right;margin-bottom:18px}
.sec{display:inline-block;background:var(--beige);font-weight:700;font-size:16px;padding:6px 16px;margin:22px 0 10px}
.sub2{font-weight:700;margin:10px 0 4px}
.doc table{width:100%;border-collapse:collapse}
.doc th,.doc td{border:1px solid #333;padding:5px 8px;vertical-align:middle;text-align:left;white-space:pre-wrap}
.doc th{background:var(--th);text-align:center;width:84px;word-break:keep-all}
.doc .c{text-align:center}
.doc .q{color:#1d4f91;font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* admin */
.admin{max-width:1150px;margin:0 auto;padding:24px}
.admin h2{font-family:"Jua";font-weight:400;font-size:28px;margin:0 0 14px;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .l{font-size:14px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:18px}
.cfg{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cfg select,.cfg input{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.tt{width:100%;border-collapse:collapse;font-size:15.5px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}
.tt th{background:#f4f2ec;font-size:14.5px}
.bar10{display:flex;gap:2px}
.bar10 i{width:12px;height:12px;border-radius:3px;background:#e2ded4;display:block}
.bar10 i.d{background:var(--accent)}.bar10 i.p{background:var(--warm)}

@media (max-width:1100px){.body{grid-template-columns:200px minmax(0,1fr)} aside.mentor{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);z-index:15;box-shadow:-6px 0 20px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .2s} aside.mentor.open{transform:none} .mtoggle{display:inline-block!important}}
@media (max-width:760px){.body{grid-template-columns:1fr} nav.steps{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px} .stepbtn{flex:0 0 auto;width:auto;white-space:nowrap} .navnote{display:none} main{padding:16px} .grid2{grid-template-columns:1fr}}
.mtoggle{display:none}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="loginView">
  <div class="card">
    <h1>🧭 PBL 설계 멘토</h1>
    <p>디지털 기반 수업 혁신 동아리 · 프로젝트 기반 학습 단원 설계</p>
    <div class="field"><label for="inName">이름</label><input id="inName" type="text" placeholder="예: 김민수" autocomplete="off"></div>
    <div class="field"><label for="inSchool">학교</label><input id="inSchool" type="text" placeholder="예: ○○중학교" autocomplete="off"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="width:100%">시작하기 / 이어서 쓰기</button>
    <div class="note">가입은 필요 없어요. 다음에 같은 이름으로 들어오면 쓰던 설계안이 이어서 열려요.<br>같은 이름의 선생님이 계시면 이름 뒤에 학교명을 붙여 주세요. (예: 김민수용문중)</div>
    <div class="note" id="localNote"></div>
  </div>
</section>

<!-- ============ TEACHER APP ============ -->
<section class="app hidden" id="appView">
  <header>
    <h1>🧭 PBL 설계 멘토</h1>
    <span class="who" id="whoLbl"></span>
    <span class="sp"></span>
    <span class="status" id="saveLbl"></span>
    <button class="hbtn" id="previewBtn">📄 전체 보기</button>
    <button class="hbtn" id="hwpBtn">한글 저장</button>
    <button class="hbtn mtoggle" id="mToggle">💬 멘토</button>
    <button class="hbtn" id="logoutBtn">나가기</button>
  </header>
  <div class="body">
    <nav class="steps" id="stepNav"></nav>
    <main id="stepMain"></main>
    <aside class="mentor" id="mentor">
      <div class="mhead"><b>AI 멘토</b><div class="rem" id="remLbl"></div></div>
      <div class="msgs" id="msgs"></div>
      <div class="mactions">
        <button class="primary" id="fbBtn">피드백 받기</button>
        <button id="hintBtn">힌트 1단계</button>
      </div>
      <div class="ask"><textarea id="askIn" placeholder="멘토에게 질문하기 (Enter 보내기)"></textarea><button id="askBtn">보내기</button></div>
    </aside>
  </div>
</section>

<!-- ============ ADMIN ============ -->
<section class="hidden" id="adminView">
  <div class="admin" id="adminBox"></div>
</section>

<div class="modal hidden" id="modal"><div class="box">
  <div class="bar"><h3 id="modalTitle">설계안 전체 보기</h3><button class="btn small" id="modalHwp">한글 저장</button><button class="btn ghost small" id="modalClose">닫기</button></div>
  <div class="doc" id="modalDoc"></div>
</div></div>

function emptyPlan(){
  const p={topic:"",author:"",school:"",target:"",subject:"수학",bigUnit:"",midUnit:"",standard:"",dq:"",method:"프로젝트 기반 학습(PBL)",genAI:"",edutech:"",
    problem:"",objectives:"",competencies:"",stages:{},aiPlan:"",lessons:[],rubric:[],passfail:"",featured:[],materials:"",reflGood:"",reflImprove:"",reflResult:"",refs:"",
    notes:{standardVerbs:"",product:"",selectReason:""},checks:{},progress:null};
  STAGES.forEach(([k])=>p.stages[k]={activity:"",period:""});
  for(let i=0;i<2;i++){const f={period:"",title:"",objective:""};FEAT.forEach(([k])=>f[k]={question:"",activity:"",notes:""});p.featured.push(f);}
  return p;
}
function mergePlan(saved){
  const base=emptyPlan(); if(!saved||typeof saved!=="object") return base;
  const out=Object.assign(base,saved);
  out.notes=Object.assign(emptyPlan().notes,saved.notes||{});
  out.stages=Object.assign(emptyPlan().stages,saved.stages||{});
  if(!Array.isArray(out.featured)||out.featured.length<2) out.featured=emptyPlan().featured;
  out.checks=saved.checks||{}; if(!Array.isArray(out.lessons)) out.lessons=[]; if(!Array.isArray(out.rubric)) out.rubric=[];
  return out;
}
let S={name:"",school:"",plan:emptyPlan(),chat:{},hint:{},step:0,remaining:null,cap:null,busy:false,dirty:false};
const LOCAL=!API_URL;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2600);}
function normName(n){return String(n||"").replace(/\s+/g,"").slice(0,30);}

// ---------------------------------------------------------------- 서버
async function api(payload){
  if(LOCAL) return localApi(payload);
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("서버 응답 오류 ("+r.status+")");
  return r.json();
}
function localApi(p){ // 시험 모드: 이 브라우저에만 저장
  const k="pblmentor-local-"+normName(p.name);
  try{
    if(p.action==="load"){const s=JSON.parse(localStorage.getItem(k)||"null"); return s?{ok:true,exists:true,...s}:{ok:true,exists:false};}
    if(p.action==="save"){localStorage.setItem(k,JSON.stringify({school:p.school,plan:p.plan,chat:p.chat,step:p.step})); return {ok:true,saved:new Date().toTimeString().slice(0,5)};}
    if(p.action==="ai") return {ok:false,error:"시험 모드에서는 AI 멘토를 쓸 수 없어요. (관리자가 서버 주소를 설정하면 작동해요.)"};
  }catch(e){return {ok:false,error:"이 브라우저에 저장할 수 없어요."};}
  return {ok:false,error:"시험 모드에서는 지원하지 않는 기능이에요."};
}

async function login(){
  const name=normName($("inName").value), school=$("inSchool").value.trim();
  if(!name){$("loginErr").textContent="이름을 입력해 주세요.";return;}
  $("loginBtn").disabled=true;$("loginErr").textContent="불러오는 중…";
  try{
    const r=await api({action:"load",name});
    if(!r.ok) throw new Error(r.error||"불러오기 실패");
    S.name=name; S.school=school||r.school||"";
    S.plan=mergePlan(r.plan); S.chat=r.chat&&typeof r.chat==="object"?r.chat:{}; S.hint={};
    S.step=Math.max(0,Math.min(STEPS.length-1,(+r.step||1)-1));
    S.remaining=r.remaining??null; S.cap=r.cap??null;
    if(!S.plan.author) S.plan.author=$("inName").value.trim();
    if(!S.plan.school) S.plan.school=S.school;
    try{localStorage.setItem("pblmentor-last",JSON.stringify({name:$("inName").value.trim(),school}));}catch(e){}

    $("whoLbl").textContent=`${S.plan.author||name} 선생님${S.school?" · "+S.school:""}`;

}

let saveTimer=null;
function markDirty(){S.dirty=true;$("saveLbl").textContent="입력 중…";clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),2500);}
function calcProgress(){
  const st=STEPS.map(s=>{const v=s.done(S.plan).map(x=>String(x||"").trim()).filter(Boolean).length,t=s.done(S.plan).length;return v===0?0:(v===t?2:1);});
  S.plan.progress={steps:st,pct:Math.round(st.reduce((a,b)=>a+b,0)/(st.length*2)*100)};
  return st;
}
async function save(force){
  if(!S.name) return; if(!S.dirty&&!force) return;
  clearTimeout(saveTimer); calcProgress();
  $("saveLbl").textContent="저장 중…";
  try{
    const r=await api({action:"save",name:S.name,school:S.school,plan:S.plan,chat:S.chat,step:S.step+1});
    if(!r.ok) throw new Error(r.error);
    S.dirty=false; $("saveLbl").textContent="저장됨 "+(r.saved||"").slice(-5);
  }catch(e){ $("saveLbl").textContent="⚠ 저장 실패 (자동 재시도)"; saveTimer=setTimeout(()=>save(true),8000); }
}
window.addEventListener("beforeunload",e=>{if(S.dirty){save(true);e.preventDefault();e.returnValue="";}});

function set(path,val){const ks=path.split(".");let o=S.plan;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}

function tx(path,label,hint,ph){return `<div class="f"><label>${label}</label>${hint?`<div class="hint">${hint}</div>`:""}<input type="text" data-path="${path}" value="${esc(get(path))}" placeholder="${esc(ph||"")}"></div>`;}

 ()=>featForm(0), ()=>featForm(1),

];

function renderNav(){
  const st=calcProgress();

   `<div class="navnote">진행률 <b>${S.plan.progress.pct}%</b><br>● 초록: 작성함 · 주황: 쓰는 중<br>순서대로 하지 않아도 돼요. 앞 단계로 돌아가 고치는 것도 좋은 공부예요.</div>`;

function updateNav(){ // 버튼을 다시 만들지 않고 상태만 갱신 (클릭이 끊기지 않도록)
  const st=calcProgress(), btns=$("stepNav").querySelectorAll(".stepbtn");

function renderMentor(){

  list.forEach(m=>box.appendChild(bubble(m)));

  const h=S.hint[S.step]||0;
  $("hintBtn").textContent=h>=3?"힌트 다시":`힌트 ${h+1}단계`+(h===2?" (예시)":"");
  $("remLbl").textContent=LOCAL?"시험 모드":(S.remaining!=null?`오늘 남은 AI 사용: ${S.remaining}회`:"");
}
function intro(){return `${S.step+1}단계 "${STEPS[S.step].title}"이에요.\n\n먼저 왼쪽 안내를 읽고 직접 써 보세요. 다 쓰면 '피드백 받기'를 눌러 주세요.\n막히면 '힌트'를 누르세요. 질문 → 구체적 힌트 → 다른 단원 예시 순서로 조금씩 도와드려요.`;}
function bubble(m){const d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":m.sys?"sys":"bot");

// ---------------------------------------------------------------- AI 멘토
function stepContent(i,p){
  const L=[];const add=(l,v)=>L.push(`${l}: ${String(v||"").trim()||"(비어 있음)"}`);
  switch(i){
    case 0: add("대상",p.target);add("교과목",p.subject);add("대단원",p.bigUnit);add("중단원",p.midUnit);add("주제",p.topic);break;
    case 1: add("성취기준",p.standard);add("성취기준 분석 메모",p.notes.standardVerbs);break;
    case 2: add("탐구 질문",p.dq);add("PBL 문제",p.problem);add("최종 산출물과 공개 대상",p.notes.product);add("수업 방법",p.method);break;
    case 3: add("학습목표",p.objectives);add("교과역량",p.competencies);break;
    case 4: p.rubric.forEach(r=>L.push(`[${r.element||"평가 요소"}] 우수: ${r.high} / 보통: ${r.mid} / 미흡: ${r.low}`)); if(!p.rubric.length)L.push("(루브릭 비어 있음)"); add("산출물 Pass/Fail",p.passfail);break;
    case 5: STAGES.forEach(([k,l])=>add(`${l} (${p.stages[k].period||"차시 미정"})`,p.stages[k].activity));break;
    case 6: p.lessons.forEach(r=>L.push(`${r.period} | ${r.stage} | ${r.activities} | AI·디지털: ${r.ai}`)); if(!p.lessons.length)L.push("(차시별 계획 비어 있음)"); add("생성형 AI",p.genAI);add("에듀테크",p.edutech);add("AI 활용 방안",p.aiPlan);add("상세 설계할 2개 차시와 이유",p.notes.selectReason);break;
    case 7: case 8: {const f=p.featured[i-7];add("차시",f.period);add("차시 제목",f.title);add("학습 목표",f.objective);FEAT.forEach(([k,l])=>{add(`${l} 핵심 질문`,f[k].question);add(`${l} 활동`,f[k].activity);add(`${l} 자료 및 유의점`,f[k].notes);});break;}
    case 9: add("교수·학습자료",p.materials);add("참고문헌",p.refs);break;
  }
  return L.join("\n");
}
function wholeSummary(p){
  return [0,1,2,3,4,5,6,7,8].filter(i=>i!==S.step).map(i=>`<${i+1}. ${STEPS[i].title}>\n${stepContent(i,p)}`).join("\n\n").slice(0,12000);
}
async function askMentor(mode,text){
  if(S.busy) return;
  const i=S.step, s=STEPS[i];
  let req,label;
  if(mode==="feedback"){req="이 단계에서 제가 쓴 내용에 피드백해 주세요. 점검 기준에 비추어 보고, 대신 써 주지 말고 제가 스스로 고칠 수 있게 도와주세요.";label="✅ 피드백 받기";}
  else if(mode==="hint"){const h=Math.min(3,(S.hint[i]||0)+1);req=`힌트 ${h}단계를 주세요.`;label=`💡 힌트 ${h}단계${h===3?" (다른 단원 예시)":""}`;}
  else {req=text;label=text;}
  const prompt=`[현재 단계] ${i+1}. ${s.title}\n[이 단계에서 할 일] ${s.todo}\n[이 단계 점검 기준]\n${s.checks.map(c=>"· "+c).join("\n")}\n\n[이 단계에서 교사가 쓴 내용]\n${stepContent(i,S.plan)}\n\n[설계안의 다른 단계(참고)]\n${wholeSummary(S.plan)}\n\n[요청] ${req}`;
  const list=S.chat[i]=S.chat[i]||[];
  const history=list.filter(m=>!m.sys).map(m=>({role:m.role,content:m.role==="user"?(m.q||m.content):m.content}));
  list.push({role:"user",content:label,q:req,label});
  renderMentor();
  const ty=document.createElement("div");ty.className="msg bot typing";ty.innerHTML="<span></span><span></span><span></span>";$("msgs").appendChild(ty);$("msgs").scrollTop=$("msgs").scrollHeight;
  S.busy=true;setMentorBusy(true);
  try{
    const r=await api({action:"ai",name:S.name,step:i+1,mode,prompt,history});
    if(!r.ok){list.push({role:"assistant",content:r.error||"응답을 받지 못했어요.",sys:true}); if(r.limit)S.remaining=0;}
    else{list.push({role:"assistant",content:r.text}); S.remaining=r.remaining; if(mode==="hint")S.hint[i]=Math.min(3,(S.hint[i]||0)+1); if(S.hint[i]>=3&&mode==="hint")S.hint[i]=3;}
  }catch(e){list.push({role:"assistant",content:"연결에 실패했어요. 잠시 후 다시 시도해 주세요.",sys:true});}
  S.busy=false;setMentorBusy(false);
  if(mode==="hint"&&(S.hint[i]||0)>=3&&$("hintBtn").textContent==="힌트 다시"){}
  markDirty();renderMentor();
}
function setMentorBusy(b){["fbBtn","hintBtn","askBtn"].forEach(id=>$(id).disabled=b);}

// ---------------- HWPX export (fills the uploaded template) ----------------
const HPNS="http://www.hancom.co.kr/hwpml/2011/paragraph";
function kids(el,name){ return [...el.children].filter(c=>c.localName===name); }
function cellAt(tbl,r,c){
  for(const tr of kids(tbl,"tr")) for(const tc of kids(tr,"tc")){
    const a=kids(tc,"cellAddr")[0];
    if(+a.getAttribute("rowAddr")===r && +a.getAttribute("colAddr")===c) return tc;
  }
  return null;
}
function setParaText(p,text){
  const runs=kids(p,"run");
  let target=runs.find(r=>kids(r,"t").length);
  runs.forEach(r=>{
    if(r===target) return;
    const ts=kids(r,"t");
    if(ts.length && r.children.length===ts.length) r.remove(); else ts.forEach(t=>t.remove());
  });
  if(!target){
    target=p.ownerDocument.createElementNS(HPNS,"hp:run");
    target.setAttribute("charPrIDRef", runs[0]?.getAttribute("charPrIDRef")||"0");
    const first=kids(p,"run")[0]; first? p.insertBefore(target,first) : p.appendChild(target);
  }
  const ts=kids(target,"t"); ts.slice(1).forEach(t=>t.remove());
  let t=ts[0]; if(!t){ t=p.ownerDocument.createElementNS(HPNS,"hp:t"); target.appendChild(t); }
  t.textContent=text;
}
function fillParas(container, protoFirst, protoRest, text, before){
  const lines=String(text??"").split("\n");
  lines.forEach((ln,i)=>{
    const np=(i===0?protoFirst:protoRest).cloneNode(true);
    setParaText(np,ln);
    before? container.insertBefore(np,before) : container.appendChild(np);
  });
}
function setCell(tc,text){
  if(!tc) return;
  const sub=kids(tc,"subList")[0], ps=kids(sub,"p");
  const first=ps[0], rest=ps[1]||ps[0];
  ps.forEach(p=>p.remove());
  fillParas(sub, first, rest, text);
}
function reRows(tbl, headerCount, protoRow, items, fill, tailRow){
  kids(tbl,"tr").slice(headerCount).forEach(tr=>tr.remove());
  const rows=[...items];
  if(!rows.length) rows.push(null);
  let r=headerCount;
  const setAddr=(tr,row)=>kids(tr,"tc").forEach(tc=>kids(tc,"cellAddr")[0].setAttribute("rowAddr",row));
  rows.forEach(it=>{ const tr=protoRow.cloneNode(true); setAddr(tr,r); tbl.appendChild(tr); fill(tr,it,r); r++; });
  if(tailRow){ setAddr(tailRow,r); tbl.appendChild(tailRow); r++; }
  tbl.setAttribute("rowCnt",r);
}
function rowCell(tr,c){ return kids(tr,"tc").find(tc=>+kids(tc,"cellAddr")[0].getAttribute("colAddr")===c); }

async function buildHwpx(p){
  if(!window.JSZip) throw new Error("nozip");
  const tz=await JSZip.loadAsync(document.getElementById("hwpx-tpl").textContent.trim(),{base64:true});
  let xml=await tz.file("Contents/section0.xml").async("string");
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("parse");
  const sec=doc.documentElement;
  const P=kids(sec,"p");
  const T=[...doc.getElementsByTagNameNS(HPNS,"tbl")];

  // title + byline
  { const ps=kids(kids(cellAt(T[0],0,1),"subList")[0],"p"); const ts=[...ps[1].getElementsByTagNameNS(HPNS,"t")];
    if(ts.length>=3){ ts[0].textContent="[ "; ts[1].textContent=p.topic||"주제"; ts[2].textContent=" ]"; } }
  setParaText(P[1], p.author||"○○○"); setParaText(P[2], p.school||"○○학교");

  // 1. 교육과정 및 성취기준 분석
  [[0,1,"target"],[0,3,"subject"],[1,1,"bigUnit"],[1,3,"midUnit"],[2,1,"standard"],[3,1,"dq"],[4,1,"method"],[5,1,"genAI"],[5,3,"edutech"]]
    .forEach(([r,c,k])=>setCell(cellAt(T[1],r,c),p[k]));

  // 2. 교수·학습 활동 설계
  setCell(cellAt(T[2],0,1),p.problem); setCell(cellAt(T[2],1,1),p.objectives);
  const has=c=>(p.competencies||"").includes(c), mk=c=>(has(c)?"☑ ":"☐ ")+c;
  setCell(cellAt(T[2],2,2),mk("문제해결")); setCell(cellAt(T[2],2,3),mk("추론")); setCell(cellAt(T[2],2,4),mk("의사소통"));
  setCell(cellAt(T[2],2,5),mk("연결")+"  "+mk("정보처리"));
  STAGES.forEach(([k],i)=>{ setCell(cellAt(T[2],4+i,1),p.stages[k].activity); setCell(cellAt(T[2],4+i,6),p.stages[k].period); });
  setCell(cellAt(T[2],10,1),p.aiPlan);

  // 3. 차시별 계획
  { const proto=kids(T[3],"tr")[1].cloneNode(true);
    reRows(T[3],1,proto,p.lessons,(tr,it)=>{ ["period","stage","activities","ai"].forEach((f,c)=>setCell(rowCell(tr,c),it?it[f]:"")); }); }

  // 4. 루브릭
  { const trs=kids(T[4],"tr"), proto=trs[1].cloneNode(true), tail=trs[trs.length-1];
    tail.remove();
    let tailRow=null;
    if((p.passfail||"").trim()){ tailRow=tail; setCell(rowCell(tail,1),p.passfail); setCell(rowCell(tail,0),"산출물\nPass/Fail"); }
    reRows(T[4],1,proto,p.rubric,(tr,it)=>{ ["element","high","mid","low"].forEach((f,c)=>setCell(rowCell(tr,c),it?it[f]:"")); },tailRow); }

  // 5. 차시별 지도안 (2개)
  { const head=P[24], body=P[25], gap=P[26];
    const head2=head.cloneNode(true), body2=body.cloneNode(true), gap2=gap.cloneNode(true);
    sec.insertBefore(gap2, gap); sec.insertBefore(head2, gap); sec.insertBefore(body2, gap);
    const fillFeat=(hp,bp,f)=>{
      const th=hp.getElementsByTagNameNS(HPNS,"tbl")[0], tb=bp.getElementsByTagNameNS(HPNS,"tbl")[0];
      setCell(cellAt(th,0,0),f.period); setCell(cellAt(th,0,1),f.title);
      setCell(cellAt(tb,0,1),f.objective);
      [["intro",2,"도입 질문"],["dev1",4,"전개 질문"],["dev2",6,"전개 질문"],["wrap",8,"정리 질문"]].forEach(([k,r,lab])=>{
        const s=f[k]; setCell(cellAt(tb,r,1),`[${lab}] ${s.question}`); setCell(cellAt(tb,r+1,1),s.activity); setCell(cellAt(tb,r,2),s.notes);
      });
    };
    fillFeat(head,body,p.featured[0]); fillFeat(head2,body2,p.featured[1]); }

  // 6. 교수·학습자료, 8. 참고문헌 (plain paragraphs, styled like the reference lines)
  const refFirst=P.findIndex(x=>/교육부\s*\(2022\)/.test(x.textContent));
  const refProto=P[refFirst].cloneNode(true);
  if((p.materials||"").trim()){
    const after=P[28].nextSibling;
    fillParas(sec, refProto, refProto, p.materials, after);
  }
  const refEnd=refFirst+6;
  const anchor=P[refEnd]||null;
  P.slice(refFirst,refEnd).forEach(x=>x.remove());
  fillParas(sec, refProto, refProto, p.refs||"", anchor);

  // 7. 수업 성찰
  setCell(cellAt(T[7],0,0),p.reflGood); setCell(cellAt(T[8],0,0),p.reflImprove); setCell(cellAt(T[9],0,0),p.reflResult);

  let out=new XMLSerializer().serializeToString(doc);
  if(!out.startsWith("<?xml")) out='<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>'+out;

  const z=new JSZip();
  z.file("mimetype","application/hwp+zip",{compression:"STORE"});
  for(const name of Object.keys(tz.files)){
    if(name==="mimetype" || tz.files[name].dir) continue;
    let data;
    if(name==="Contents/section0.xml") data=out;
    else if(name==="Preview/PrvText.txt") data=planText(p).slice(0,1000);
    else data=await tz.file(name).async("uint8array");
    z.file(name,data,{compression:"DEFLATE"});
  }
  return z.generateAsync({type:"uint8array"});
}
